[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.138.0",
    "pip>=26.1.2",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
    "unicorn>=2.1.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100", "D101", "D104", "D106",
    "D203", "D213",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["ALL"]  # Autogenerated files. Don't want to run linting on these.
"alembic/**/*" = ["INP001", "D100"]
"tests/**" = ["S101", "D102", "D103", "PLR2004"]
